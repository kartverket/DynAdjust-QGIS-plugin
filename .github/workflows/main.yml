name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '[1-99].[0-9]'

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          cd dynadjustplugin
          python -m pip install -r requirements.txt

      - name: Install DynAdjust binaries
        env:
          DYNADJUST_VERSION: v1.4.1
        run: |
          set -euo pipefail
          install_dir="dynadjustplugin/dynadjust"
          mkdir -p "$install_dir/linux" "$install_dir/windows" "$install_dir/macos"

          # The Kartverket fork publishes source; use the upstream's matching binary release.
          curl --fail --location --retry 3 \
            "https://github.com/GeoscienceAustralia/DynAdjust/releases/download/${DYNADJUST_VERSION}/dynadjust-linux-openblas-static.zip" \
            --output "$RUNNER_TEMP/dynadjust-linux.zip"
          echo "0de13c0d46681133ef31dd740df96ba7a06c417041c99dcbe53048f2c05e175b  $RUNNER_TEMP/dynadjust-linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dynadjust-linux.zip" -d "$install_dir/linux"

          curl --fail --location --retry 3 \
            "https://github.com/GeoscienceAustralia/DynAdjust/releases/download/${DYNADJUST_VERSION}/dynadjust-windows-openblas.zip" \
            --output "$RUNNER_TEMP/dynadjust-windows.zip"
          echo "a88c03e540562f776556a15a059c297a5e3ea8604d3d1653843e4a2261cd8481  $RUNNER_TEMP/dynadjust-windows.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dynadjust-windows.zip" -d "$install_dir/windows"

          curl --fail --location --retry 3 \
            "https://github.com/GeoscienceAustralia/DynAdjust/releases/download/${DYNADJUST_VERSION}/dynadjust-macos-static.zip" \
            --output "$RUNNER_TEMP/dynadjust-macos.zip"
          echo "8e5fc3e16aa70aa88eaed4dab5aa4277589c03c5d2db447d90c5932e8094c23e  $RUNNER_TEMP/dynadjust-macos.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dynadjust-macos.zip" -d "$install_dir/macos"
          
      - name: Delete deployed plugin
        working-directory: dynadjustplugin
        run: |
          echo "y" | pb_tool clean
          echo "y" | pb_tool dclean
          
      - name: Install Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-tools-dev qt6-tools-dev-tools
         # python -m pip install --upgrade pyqt6 pyqt6-tools

      - name: Compile plugin resources
        working-directory: dynadjustplugin
        run: |
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):${PATH}"
          export PATH="/usr/lib/qt6/libexec:${PATH}"
          command -v rcc
          command -v pyrcc6 || command -v rcc
          pb_tool compile
          test -s resources.py         
          pb_tool zip
          
     #  echo "y" | pb_tool deploy
     # - name: Run pb_tool deploy
     #   run: |
     #     cd dynadjustplugin
     #     pb_tool clean
     #     rm -rf "$HOME/.local/share/QGIS/QGIS4/profiles/default/python/plugins/dynadjustplugin"
     #     pb_tool compile
     #     pb_tool zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./dynadjustplugin/zip_build/dynadjustplugin.zip
          asset_name: dynadjust_plugin_app_${{ github.ref_name }}.zip
          asset_content_type: application/zip
