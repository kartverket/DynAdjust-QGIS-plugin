[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynadjustplugin"
version = "0.2"
description = "DynaML models for the DynAdjust QGIS plugin"
requires-python = ">=3.12"

[project.optional-dependencies]
xml = ["xsdata[lxml]"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "dynadjustplugin",
    "dynadjustplugin.core",
    "dynadjustplugin.models",
    "dynadjustplugin.qgis",
    "dynadjustplugin.services",
]
exclude = ["dynadjustplugin.test*"]
